openapi: 3.2.0
info:
  contact:
    email: dev@nifi.apache.org
    url: https://nifi.apache.org
  description: REST API definition for Apache NiFi web services
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: Apache NiFi REST Processors API
  version: 2.12.0
security:
- HTTPBearerJWT: []
- CookieSecureAuthorizationBearer: []
tags:
- name: Processors
paths:
  /processors/run-status-details/queries:
    post:
      operationId: getProcessorRunStatusDetails
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/RunStatusDetailsRequestEntity'
          application/json:
            schema:
              $ref: '#/components/schemas/RunStatusDetailsRequestEntity'
        description: The request for the processors that should be included in the results
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessorsRunStatusDetailsEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /processors/{uuid} for each processor whose run status information is requested: []
      summary: Submits a query to retrieve the run status details of all processors that are…
      tags:
      - Processors
  /processors/{id}:
    delete:
      operationId: deleteProcessor
      parameters:
      - description: The revision is used to verify the client is working with the latest version of the flow.
        in: query
        name: version
        schema:
          $ref: '#/components/schemas/LongParameter'
      - description: If the client id is not specified, new one will be generated. This value (whether specified or generated) is included in the response.
        in: query
        name: clientId
        schema:
          $ref: '#/components/schemas/ClientIdParameter'
      - description: Acknowledges that this node is disconnected to allow for mutable requests to proceed.
        in: query
        name: disconnectedNodeAcknowledged
        schema:
          type: boolean
          default: false
      - description: The processor id.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessorEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /processors/{uuid}: []
      - Write - Parent Process Group - /process-groups/{uuid}: []
      - Read - any referenced Controller Services - /controller-services/{uuid}: []
      summary: Deletes a processor
      tags:
      - Processors
    get:
      operationId: getProcessor
      parameters:
      - description: The processor id.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessorEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /processors/{uuid}: []
      summary: Gets a processor
      tags:
      - Processors
    put:
      operationId: updateProcessor
      parameters:
      - description: The processor id.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessorEntity'
        description: The processor configuration details.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessorEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /processors/{uuid}: []
      - Read - any referenced Controller Services if this request changes the reference - /controller-services/{uuid}: []
      summary: Updates a processor
      tags:
      - Processors
  /processors/{id}/backlog-requests:
    post:
      description: This will initiate the process of determining the backlog for a Processor. This may be a long-running task. As a result, this endpoint will immediately return a BacklogRequestEntity, and the process of determining the backlog will occur asynchronously in the background. The client may then periodically poll the status of the request by issuing a GET request to /processors/{processorId}/backlog-requests/{requestId}. Once the request is completed, the client is expected to issue a DELETE request to /processors/{processorId}/backlog-requests/{requestId}.
      operationId: submitProcessorBacklogRequest
      parameters:
      - description: The processor id.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacklogRequestEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /processors/{uuid}: []
      summary: Initiates a request to determine the current backlog for a processor that…
      tags:
      - Processors
  /processors/{id}/backlog-requests/{requestId}:
    delete:
      description: Deletes the Backlog Request with the given ID. After a request is created, it is expected that the client will properly clean up the request by DELETE'ing it once the backlog determination has completed. If the request is deleted before it completes, the background determination is cancelled.
      operationId: deleteBacklogRequest
      parameters:
      - description: The processor id.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The ID of the Backlog Request
        in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacklogRequestEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Only the user that submitted the request can remove it: []
      summary: Deletes the Backlog Request with the given ID
      tags:
      - Processors
    get:
      description: Returns the Backlog Request with the given ID. Once a Backlog Request has been created by performing a POST to /processors/{processorId}/backlog-requests, that request can subsequently be retrieved via this endpoint, and the request that is fetched will contain the updated state, such as percent complete, the current state of the request, and the backlog once the request is complete.
      operationId: getBacklogRequest
      parameters:
      - description: The processor id.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The ID of the Backlog Request
        in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacklogRequestEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Only the user that submitted the request can get it: []
      summary: Returns the Backlog Request with the given ID
      tags:
      - Processors
  /processors/{id}/bulletins/clear-requests:
    post:
      operationId: clearBulletins_5
      parameters:
      - description: The processor id.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClearBulletinsRequestEntity'
        description: The clear bulletin request specifying the timestamp from which to clear bulletins.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearBulletinsResultEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /processors/{uuid}: []
      summary: Clears bulletins for a processor
      tags:
      - Processors
  /processors/{id}/config/analysis:
    post:
      operationId: analyzeConfiguration_2
      parameters:
      - description: The processor id.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationAnalysisEntity'
        description: The processor configuration analysis request.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationAnalysisEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /processors/{uuid}: []
      summary: Performs analysis of the component's configuration, providing information about…
      tags:
      - Processors
  /processors/{id}/config/verification-requests:
    post:
      description: This will initiate the process of verifying a given Processor configuration. This may be a long-running task. As a result, this endpoint will immediately return a ProcessorConfigVerificationRequestEntity, and the process of performing the verification will occur asynchronously in the background. The client may then periodically poll the status of the request by issuing a GET request to /processors/{processorId}/verification-requests/{requestId}. Once the request is completed, the client is expected to issue a DELETE request to /processors/{processorId}/verification-requests/{requestId}.
      operationId: submitProcessorVerificationRequest
      parameters:
      - description: The processor id.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyConfigRequestEntity'
        description: The processor configuration verification request.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyConfigRequestEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /processors/{uuid}: []
      - Read - any referenced Controller Services - /controller-services/{uuid}: []
      summary: Performs verification of the Processor's configuration
      tags:
      - Processors
  /processors/{id}/config/verification-requests/{requestId}:
    delete:
      description: Deletes the Verification Request with the given ID. After a request is created, it is expected that the client will properly clean up the request by DELETE'ing it, once the Verification process has completed. If the request is deleted before the request completes, then the Verification request will finish the step that it is currently performing and then will cancel any subsequent steps.
      operationId: deleteVerificationRequest_2
      parameters:
      - description: The ID of the Processor
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The ID of the Verification Request
        in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyConfigRequestEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Only the user that submitted the request can remove it: []
      summary: Deletes the Verification Request with the given ID
      tags:
      - Processors
    get:
      description: Returns the Verification Request with the given ID. Once an Verification Request has been created, that request can subsequently be retrieved via this endpoint, and the request that is fetched will contain the updated state, such as percent complete, the current state of the request, and any failures.
      operationId: getVerificationRequest_2
      parameters:
      - description: The ID of the Processor
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The ID of the Verification Request
        in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyConfigRequestEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Only the user that submitted the request can get it: []
      summary: Returns the Verification Request with the given ID
      tags:
      - Processors
  /processors/{id}/descriptors:
    get:
      operationId: getPropertyDescriptor_3
      parameters:
      - description: If the client id is not specified, new one will be generated. This value (whether specified or generated) is included in the response.
        in: query
        name: clientId
        schema:
          $ref: '#/components/schemas/ClientIdParameter'
      - description: The processor id.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The property name.
        in: query
        name: propertyName
        required: true
        schema:
          type: string
      - description: Property Descriptor requested sensitive status
        in: query
        name: sensitive
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDescriptorEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /processors/{uuid}: []
      summary: Gets the descriptor for a processor property
      tags:
      - Processors
  /processors/{id}/diagnostics:
    get:
      description: 'Note: This endpoint is subject to change as NiFi and it''s REST API evolve.'
      operationId: getProcessorDiagnostics
      parameters:
      - description: The processor id.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessorEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /processors/{uuid}: []
      summary: Gets diagnostics information about a processor
      tags:
      - Processors
  /processors/{id}/run-status:
    put:
      operationId: updateRunStatus_5
      parameters:
      - description: The processor id.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessorRunStatusEntity'
        description: The processor run status.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessorEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /processors/{uuid} or /operation/processors/{uuid}: []
      summary: Updates run status of a processor
      tags:
      - Processors
  /processors/{id}/state:
    get:
      operationId: getState_2
      parameters:
      - description: The processor id.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentStateEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /processors/{uuid}: []
      summary: Gets the state for a processor
      tags:
      - Processors
  /processors/{id}/state/clear-requests:
    post:
      operationId: clearState_3
      parameters:
      - description: The processor id.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/ComponentStateEntity'
          application/json:
            schema:
              $ref: '#/components/schemas/ComponentStateEntity'
        description: Optional component state to perform a selective key removal. If omitted, clears all state.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentStateEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /processors/{uuid}: []
      summary: Clears the state for a processor
      tags:
      - Processors
  /processors/{id}/threads:
    delete:
      operationId: terminateProcessor
      parameters:
      - description: The processor id.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessorEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /processors/{uuid} or /operation/processors/{uuid}: []
      summary: Terminates a processor, essentially "deleting" its threads and any active tasks
      tags:
      - Processors
components:
  schemas:
    PropertyDescriptorDTO:
      type: object
      description: The descriptors for the reporting tasks properties.
      properties:
        allowableValues:
          type: array
          description: Allowable values for the property. If empty then the allowed values are not constrained.
          items:
            $ref: '#/components/schemas/AllowableValueEntity'
        defaultValue:
          type: string
          description: The default value for the property.
        dependencies:
          type: array
          description: A list of dependencies that must be met in order for this Property to be relevant. If any of these dependencies is not met, the property described by this Property Descriptor is not relevant.
          items:
            $ref: '#/components/schemas/PropertyDependencyDTO'
        description:
          type: string
          description: The description for the property. Used to relay additional details to a user or provide a mechanism of documenting intent.
        displayName:
          type: string
          description: The human readable name for the property.
        dynamic:
          type: boolean
          description: Whether the property is dynamic (user-defined).
        expressionLanguageScope:
          type: string
          description: Scope of the Expression Language evaluation for the property.
        identifiesControllerService:
          type: string
          description: If the property identifies a controller service this returns the fully qualified type.
        identifiesControllerServiceBundle:
          $ref: '#/components/schemas/BundleDTO'
        name:
          type: string
          description: The name for the property.
        required:
          type: boolean
          description: Whether the property is required.
        sensitive:
          type: boolean
          description: Whether the property is sensitive and protected whenever stored or represented.
        supportsEl:
          type: boolean
          description: Whether the property supports expression language.
    ProcessingPerformanceStatusDTO:
      type: object
      description: Represents the processor's processing performance.
      properties:
        contentReadDuration:
          type: integer
          format: int64
          description: The number of nanoseconds has spent to read content in the last 5 minutes.
        contentWriteDuration:
          type: integer
          format: int64
          description: The number of nanoseconds has spent to write content in the last 5 minutes.
        cpuDuration:
          type: integer
          format: int64
          description: The number of nanoseconds has spent on CPU usage in the last 5 minutes.
        garbageCollectionDuration:
          type: integer
          format: int64
          description: The number of nanoseconds has spent running garbage collection in the last 5 minutes.
        identifier:
          type: string
          description: The unique ID of the process group that the Processor belongs to
        sessionCommitDuration:
          type: integer
          format: int64
          description: The number of nanoseconds has spent running to commit sessions the last 5 minutes.
    ProcessorsRunStatusDetailsEntity:
      type: object
      properties:
        runStatusDetails:
          type: array
          items:
            $ref: '#/components/schemas/ProcessorRunStatusDetailsEntity'
      xml:
        name: processorsRunStatusDetails
    StateMapDTO:
      type: object
      description: The local state for this component.
      properties:
        scope:
          type: string
          description: The scope of this StateMap.
        state:
          type: array
          description: The state.
          items:
            $ref: '#/components/schemas/StateEntryDTO'
        totalEntryCount:
          type: integer
          format: int32
          description: The total number of state entries. When the state map is lengthy, only of portion of the entries are returned.
    ProcessorDTO:
      type: object
      properties:
        bundle:
          $ref: '#/components/schemas/BundleDTO'
        config:
          $ref: '#/components/schemas/ProcessorConfigDTO'
        deprecated:
          type: boolean
          description: Whether the processor has been deprecated.
        description:
          type: string
          description: The description of the processor.
        executionNodeRestricted:
          type: boolean
          description: Indicates if the execution node of a processor is restricted to run only on the primary node
        extensionMissing:
          type: boolean
          description: Whether the underlying extension is missing.
        id:
          type: string
          description: The id of the component.
        inputRequirement:
          type: string
          description: The input requirement for this processor.
        multipleVersionsAvailable:
          type: boolean
          description: Whether the processor has multiple versions available.
        name:
          type: string
          description: The name of the processor.
        parentGroupId:
          type: string
          description: The id of parent process group of this component if applicable.
        persistsState:
          type: boolean
          description: Whether the processor persists state.
        physicalState:
          type: string
          description: The physical state of the processor, including transition states
          enum:
          - RUNNING
          - STOPPED
          - DISABLED
          - STARTING
          - STOPPING
          - RUN_ONCE
        position:
          $ref: '#/components/schemas/PositionDTO'
        relationships:
          type: array
          description: The available relationships that the processor currently supports.
          items:
            $ref: '#/components/schemas/RelationshipDTO'
          readOnly: true
        restricted:
