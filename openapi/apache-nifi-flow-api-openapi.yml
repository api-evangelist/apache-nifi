components:
  schemas:
    ControllerStatusEntity:
      type: object
      properties:
        controllerStatus:
          $ref: '#/components/schemas/ControllerStatusDTO'
      xml:
        name: controllerStatusEntity
    FlowComparisonEntity:
      type: object
      properties:
        componentDifferences:
          type: array
          description: The list of differences for each component in the flow that is not the same between the two flows
          items:
            $ref: '#/components/schemas/ComponentDifferenceDTO'
          uniqueItems: true
      xml:
        name: flowComparisonEntity
    FlowRegistryClientDefinition:
      type: object
      description: Flow Registry Clients provided in this bundle
      properties:
        additionalDetails:
          type: boolean
          description: Indicates if the component has additional details documentation
        artifact:
          type: string
          description: The artifact name of the bundle that provides the referenced type.
        buildInfo:
          $ref: '#/components/schemas/BuildInfo'
        deprecated:
          type: boolean
          description: Whether or not the component has been deprecated
        deprecationAlternatives:
          type: array
          description: If this component has been deprecated, this optional field provides alternatives to use
          items:
            type: string
            description: If this component has been deprecated, this optional field provides alternatives to use
          uniqueItems: true
        deprecationReason:
          type: string
          description: If this component has been deprecated, this optional field can be used to provide an explanation
        dynamicProperties:
          type: array
          description: Describes the dynamic properties supported by this component
          items:
            $ref: '#/components/schemas/DynamicProperty'
        explicitRestrictions:
          type: array
          description: Explicit restrictions that indicate a require permission to use the component
          items:
            $ref: '#/components/schemas/Restriction'
          uniqueItems: true
        group:
          type: string
          description: The group name of the bundle that provides the referenced type.
        propertyDescriptors:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PropertyDescriptor'
          description: Descriptions of configuration properties applicable to this component.
        providedApiImplementations:
          type: array
          description: If this type represents a provider for an interface, this lists the APIs it implements
          items:
            $ref: '#/components/schemas/DefinedType'
        restricted:
          type: boolean
          description: Whether or not the component has a general restriction
        restrictedExplanation:
          type: string
          description: An optional description of the general restriction
        seeAlso:
          type: array
          description: The names of other component types that may be related
          items:
            type: string
            description: The names of other component types that may be related
          uniqueItems: true
        stateful:
          $ref: '#/components/schemas/Stateful'
        supportsDynamicProperties:
          type: boolean
          description: Whether or not this component makes use of dynamic (user-set) properties.
        supportsSensitiveDynamicProperties:
          type: boolean
          description: Whether or not this component makes use of sensitive dynamic (user-set) properties.
        systemResourceConsiderations:
          type: array
          description: The system resource considerations for the given component
          items:
            $ref: '#/components/schemas/SystemResourceConsideration'
        tags:
          type: array
          description: The tags associated with this type
          items:
            type: string
            description: The tags associated with this type
          uniqueItems: true
        type:
          type: string
          description: The fully-qualified class type
        typeDescription:
          type: string
          description: The description of the type.
        version:
          type: string
          description: The version of the bundle that provides the referenced type.
    RegisteredFlowSnapshotMetadata:
      type: object
      properties:
        author:
          type: string
        branch:
          type: string
        bucketIdentifier:
          type: string
        comments:
          type: string
        flowIdentifier:
          type: string
        flowName:
          type: string
        registryIdentifier:
          type: string
        registryName:
          type: string
        timestamp:
          type: integer
          format: int64
        version:
          type: string
    PropertyDescriptorDTO:
      type: object
      description: The descriptors for the reporting tasks properties.
      properties:
        allowableValues:
          type: array
          description: Allowable values for the property. If empty then the allowed values are not constrained.
          items:
            $ref: '#/components/schemas/AllowableValueEntity'
        defaultValue:
          type: string
          description: The default value for the property.
        dependencies:
          type: array
          description: A list of dependencies that must be met in order for this Property to be relevant. If any of these dependencies is not met, the property described by this Property Descriptor is not relevant.
          items:
            $ref: '#/components/schemas/PropertyDependencyDTO'
        description:
          type: string
          description: The description for the property. Used to relay additional details to a user or provide a mechanism of documenting intent.
        displayName:
          type: string
          description: The human readable name for the property.
        dynamic:
