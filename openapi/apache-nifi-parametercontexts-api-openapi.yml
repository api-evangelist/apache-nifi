openapi: 3.2.0
info:
  contact:
    email: dev@nifi.apache.org
    url: https://nifi.apache.org
  description: REST API definition for Apache NiFi web services
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: Apache NiFi REST Parameter Contexts API
  version: 2.12.0
security:
- HTTPBearerJWT: []
- CookieSecureAuthorizationBearer: []
tags:
- name: ParameterContexts
paths:
  /parameter-contexts:
    post:
      operationId: createParameterContext
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParameterContextEntity'
        description: The Parameter Context.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterContextEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /parameter-contexts: []
      - Read - for every inherited parameter context: []
      summary: Create a Parameter Context
      tags:
      - ParameterContexts
  /parameter-contexts/{contextId}/assets:
    get:
      operationId: getAssets_1
      parameters:
      - description: The ID of the Parameter Context
        in: path
        name: contextId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetsEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /parameter-contexts/{id}: []
      summary: Lists the assets that belong to the Parameter Context with the given ID
      tags:
      - ParameterContexts
    post:
      description: This endpoint will create a new Asset in the given Parameter Context. The Asset will be created with the given name and the contents of the file that is uploaded. The Asset will be created in the given Parameter Context, and will be available for use by any component that references the Parameter Context.
      operationId: createAsset_1
      parameters:
      - in: path
        name: contextId
        required: true
        schema:
          type: string
      - in: header
        name: Filename
        schema:
          type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: object
        description: The contents of the asset.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /parameter-contexts/{parameterContextId}: []
      - Write - /parameter-contexts/{parameterContextId}: []
      - Read - for every component that is affected by the update: []
      - Write - for every component that is affected by the update: []
      - Read - for every currently inherited parameter context: []
      summary: Creates a new Asset in the given Parameter Context
      tags:
      - ParameterContexts
  /parameter-contexts/{contextId}/assets/{assetId}:
    delete:
      description: This endpoint will create a new Asset in the given Parameter Context. The Asset will be created with the given name and the contents of the file that is uploaded. The Asset will be created in the given Parameter Context, and will be available for use by any component that references the Parameter Context.
      operationId: deleteAsset
      parameters:
      - description: Acknowledges that this node is disconnected to allow for mutable requests to proceed.
        in: query
        name: disconnectedNodeAcknowledged
        schema:
          type: boolean
          default: false
      - description: The ID of the Parameter Context
        in: path
        name: contextId
        required: true
        schema:
          type: string
      - description: The ID of the Asset
        in: path
        name: assetId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /parameter-contexts/{parameterContextId}: []
      - Write - /parameter-contexts/{parameterContextId}: []
      - Read - for every component that is affected by the update: []
      - Write - for every component that is affected by the update: []
      - Read - for every currently inherited parameter context: []
      summary: Deletes an Asset from the given Parameter Context
      tags:
      - ParameterContexts
    get:
      operationId: getAssetContent_1
      parameters:
      - description: The ID of the Parameter Context
        in: path
        name: contextId
        required: true
        schema:
          type: string
      - description: The ID of the Asset
        in: path
        name: assetId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: byte
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /parameter-contexts/{id}: []
      summary: Retrieves the content of the asset with the given id
      tags:
      - ParameterContexts
  /parameter-contexts/{contextId}/update-requests:
    post:
      description: This will initiate the process of updating a Parameter Context. Changing the value of a Parameter may require that one or more components be stopped and restarted, so this action may take significantly more time than many other REST API actions. As a result, this endpoint will immediately return a ParameterContextUpdateRequestEntity, and the process of updating the necessary components will occur asynchronously in the background. The client may then periodically poll the status of the request by issuing a GET request to /parameter-contexts/update-requests/{requestId}. Once the request is completed, the client is expected to issue a DELETE request to /parameter-contexts/update-requests/{requestId}.
      operationId: submitParameterContextUpdate
      parameters:
      - in: path
        name: contextId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParameterContextEntity'
        description: The updated version of the parameter context.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterContextUpdateRequestEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /parameter-contexts/{parameterContextId}: []
      - Write - /parameter-contexts/{parameterContextId}: []
      - Read - for every component that is affected by the update: []
      - Write - for every component that is affected by the update: []
      - Read - for every currently inherited parameter context: []
      - Read - for any new inherited parameter context: []
      summary: Initiate the Update Request of a Parameter Context
      tags:
      - ParameterContexts
  /parameter-contexts/{contextId}/update-requests/{requestId}:
    delete:
      description: Deletes the Update Request with the given ID. After a request is created via a POST to /nifi-api/parameter-contexts/update-requests, it is expected that the client will properly clean up the request by DELETE'ing it, once the Update process has completed. If the request is deleted before the request completes, then the Update request will finish the step that it is currently performing and then will cancel any subsequent steps.
      operationId: deleteUpdateRequest
      parameters:
      - description: Acknowledges that this node is disconnected to allow for mutable requests to proceed.
        in: query
        name: disconnectedNodeAcknowledged
        schema:
          type: boolean
          default: false
      - description: The ID of the ParameterContext
        in: path
        name: contextId
        required: true
        schema:
          type: string
      - description: The ID of the Update Request
        in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterContextUpdateRequestEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Only the user that submitted the request can remove it: []
      summary: Deletes the Update Request with the given ID
      tags:
      - ParameterContexts
    get:
      description: Returns the Update Request with the given ID. Once an Update Request has been created by performing a POST to /nifi-api/parameter-contexts, that request can subsequently be retrieved via this endpoint, and the request that is fetched will contain the updated state, such as percent complete, the current state of the request, and any failures.
      operationId: getParameterContextUpdate
      parameters:
      - description: The ID of the Parameter Context
        in: path
        name: contextId
        required: true
        schema:
          type: string
      - description: The ID of the Update Request
        in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterContextUpdateRequestEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Only the user that submitted the request can get it: []
      summary: Returns the Update Request with the given ID
      tags:
      - ParameterContexts
  /parameter-contexts/{contextId}/validation-requests:
    post:
      description: This will initiate the process of validating all components whose Process Group is bound to the specified Parameter Context. Performing validation against an arbitrary number of components may be expect and take significantly more time than many other REST API actions. As a result, this endpoint will immediately return a ParameterContextValidationRequestEntity, and the process of validating the necessary components will occur asynchronously in the background. The client may then periodically poll the status of the request by issuing a GET request to /parameter-contexts/validation-requests/{requestId}. Once the request is completed, the client is expected to issue a DELETE request to /parameter-contexts/validation-requests/{requestId}.
      operationId: submitValidationRequest
      parameters:
      - description: The ID of the ParameterContext
        in: path
        name: contextId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParameterContextValidationRequestEntity'
        description: The validation request
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterContextValidationRequestEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /parameter-contexts/{parameterContextId}: []
      - Write - /parameter-contexts/{parameterContextId}: []
      summary: Initiate a Validation Request to determine how the validity of components will…
      tags:
      - ParameterContexts
  /parameter-contexts/{contextId}/validation-requests/{id}:
    delete:
      description: Deletes the Validation Request with the given ID. After a request is created via a POST to /nifi-api/validation-contexts, it is expected that the client will properly clean up the request by DELETE'ing it, once the validation process has completed. If the request is deleted before the request completes, then the Validation request will finish the step that it is currently performing and then will cancel any subsequent steps.
      operationId: deleteValidationRequest
      parameters:
      - description: Acknowledges that this node is disconnected to allow for mutable requests to proceed.
        in: query
        name: disconnectedNodeAcknowledged
        schema:
          type: boolean
          default: false
      - description: The ID of the Parameter Context
        in: path
        name: contextId
        required: true
        schema:
          type: string
      - description: The ID of the Update Request
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterContextValidationRequestEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Only the user that submitted the request can remove it: []
      summary: Deletes the Validation Request with the given ID
      tags:
      - ParameterContexts
    get:
      description: Returns the Validation Request with the given ID. Once a Validation Request has been created by performing a POST to /nifi-api/validation-contexts, that request can subsequently be retrieved via this endpoint, and the request that is fetched will contain the updated state, such as percent complete, the current state of the request, and any failures.
      operationId: getValidationRequest
      parameters:
      - description: The ID of the Parameter Context
        in: path
        name: contextId
        required: true
        schema:
          type: string
      - description: The ID of the Validation Request
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterContextValidationRequestEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Only the user that submitted the request can get it: []
      summary: Returns the Validation Request with the given ID
      tags:
      - ParameterContexts
  /parameter-contexts/{id}:
    delete:
      description: Deletes the Parameter Context with the given ID.
      operationId: deleteParameterContext
      parameters:
      - description: The version is used to verify the client is working with the latest version of the flow.
        in: query
        name: version
        schema:
          $ref: '#/components/schemas/LongParameter'
      - description: If the client id is not specified, a new one will be generated. This value (whether specified or generated) is included in the response.
        in: query
        name: clientId
        schema:
          $ref: '#/components/schemas/ClientIdParameter'
      - description: Acknowledges that this node is disconnected to allow for mutable requests to proceed.
        in: query
        name: disconnectedNodeAcknowledged
        schema:
          type: boolean
          default: false
      - description: The Parameter Context ID.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterContextEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /parameter-contexts/{uuid}: []
      - Write - /parameter-contexts/{uuid}: []
      - Read - /process-groups/{uuid}, for any Process Group that is currently bound to the Parameter Context: []
      - Write - /process-groups/{uuid}, for any Process Group that is currently bound to the Parameter Context: []
      summary: Deletes the Parameter Context with the given ID
      tags:
      - ParameterContexts
    get:
      description: Returns the Parameter Context with the given ID.
      operationId: getParameterContext
      parameters:
      - description: The ID of the Parameter Context
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Whether or not to include inherited parameters from other parameter contexts, and therefore also overridden values.  If true, the result will be the 'effective' parameter context.
        in: query
        name: includeInheritedParameters
        schema:
          type: boolean
          default: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterContextEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /parameter-contexts/{id}: []
      summary: Returns the Parameter Context with the given ID
      tags:
      - ParameterContexts
    put:
      description: This endpoint will update a Parameter Context to match the provided entity. However, this request will fail if any component is running and is referencing a Parameter in the Parameter Context. Generally, this endpoint is not called directly. Instead, an update request should be submitted by making a POST to the /parameter-contexts/update-requests endpoint. That endpoint will, in turn, call this endpoint.
      operationId: updateParameterContext
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParameterContextEntity'
        description: The updated Parameter Context
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterContextEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /parameter-contexts/{id}: []
      - Write - /parameter-contexts/{id}: []
      - Read - for every component that is affected by the update: []
      - Write - for every component that is affected by the update: []
      - Read - for every currently inherited parameter context: []
      - Read - for any new inherited parameter context: []
      summary: Modifies a Parameter Context
      tags:
      - ParameterContexts
components:
  schemas:
    RegisteredFlowSnapshotMetadata:
      type: object
      properties:
        author:
          type: string
        branch:
          type: string
        bucketIdentifier:
          type: string
        comments:
          type: string
        flowIdentifier:
          type: string
        flowName:
          type: string
        registryIdentifier:
          type: string
        registryName:
          type: string
        timestamp:
          type: integer
          format: int64
        version:
          type: string
    PropertyDescriptorDTO:
      type: object
      description: The descriptors for the reporting tasks properties.
      properties:
        allowableValues:
          type: array
          description: Allowable values for the property. If empty then the allowed values are not constrained.
          items:
            $ref: '#/components/schemas/AllowableValueEntity'
        defaultValue:
          type: string
          description: The default value for the property.
        dependencies:
          type: array
          description: A list of dependencies that must be met in order for this Property to be relevant. If any of these dependencies is not met, the property described by this Property Descriptor is not relevant.
          items:
            $ref: '#/components/schemas/PropertyDependencyDTO'
        description:
          type: string
          description: The description for the property. Used to relay additional details to a user or provide a mechanism of documenting intent.
        displayName:
          type: string
          description: The human readable name for the property.
        dynamic:
          type: boolean
          description: Whether the property is dynamic (user-defined).
        expressionLanguageScope:
          type: string
          description: Scope of the Expression Language evaluation for the property.
        identifiesControllerService:
          type: string
          description: If the property identifies a controller service this returns the fully qualified type.
        identifiesControllerServiceBundle:
          $ref: '#/components/schemas/BundleDTO'
        name:
          type: string
          description: The name for the property.
        required:
          type: boolean
          description: Whether the property is required.
        sensitive:
          type: boolean
          description: Whether the property is sensitive and protected whenever stored or represented.
        supportsEl:
          type: boolean
          description: Whether the property supports expression language.
    ParameterContextUpdateRequestEntity:
      type: object
      properties:
        parameterContextRevision:
          $ref: '#/components/schemas/RevisionDTO'
        request:
          $ref: '#/components/schemas/ParameterContextUpdateRequestDTO'
      xml:
        name: parameterContextUpdateRequestEntity
    ProcessorDTO:
      type: object
      properties:
        bundle:
          $ref: '#/components/schemas/BundleDTO'
        config:
          $ref: '#/components/schemas/ProcessorConfigDTO'
        deprecated:
          type: boolean
          description: Whether the processor has been deprecated.
        description:
          type: string
          description: The description of the processor.
        executionNodeRestricted:
          type: boolean
          description: Indicates if the execution node of a processor is restricted to run only on the primary node
        extensionMissing:
          type: boolean
          description: Whether the underlying extension is missing.
        id:
          type: string
          description: The id of the component.
        inputRequirement:
          type: string
          description: The input requirement for this processor.
        multipleVersionsAvailable:
          type: boolean
          description: Whether the processor has multiple versions available.
        name:
          type: string
          description: The name of the processor.
        parentGroupId:
          type: string
          description: The id of parent process group of this component if applicable.
        persistsState:
          type: boolean
          description: Whether the processor persists state.
        physicalState:
          type: string
          description: The physical state of the processor, including transition states
          enum:
          - RUNNING
          - STOPPED
          - DISABLED
          - STARTING
          - STOPPING
          - RUN_ONCE
        position:
          $ref: '#/components/schemas/PositionDTO'
        relationships:
          type: array
          description: The available relationships that the processor currently supports.
          items:
            $ref: '#/components/schemas/RelationshipDTO'
          readOnly: true
        restricted:
          type: boolean
          description: Whether the processor requires elevated privileges.
        state:
          type: string
          description: The state of the processor
          enum:
          - RUNNING
          - STOPPED
          - DISABLED
          - RUN_ONCE
        style:
          type: object
          additionalProperties:
            type: string
            description: 'Styles for the processor (background-color : #eee).'
          description: 'Styles for the processor (background-color : #eee).'
        supportsBacklogReporting:
          type: boolean
          description: Whether the processor implements BacklogReportingProcessor and can report a backlog.
        supportsBatching:
          type: boolean
          description: Whether the processor supports batching. This makes the run duration settings available.
        supportsParallelProcessing:
          type: boolean
          description: Whether the processor supports parallel processing.
        supportsSensitiveDynamicProperties:
          type: boolean
          description: Whether the processor supports sensitive dynamic properties.
        type:
          type: string
          description: The type of the processor.
        validationErrors:
          type: array
          description: The validation errors for the processor. These validation errors represent the problems with the processor that must be resolved before it can be started.
          items:
            type: string
            description: The validation errors for the processor. These validation errors represent the problems with the processor that must be resolved before it can be started.
        validationStatus:
          type: string
          description: Indicates whether the Processor is valid, invalid, or still in the process of validating (i.e., it is unknown whether or not the Processor is valid)
          enum:
          - VALID
          - INVALID
          - VALIDATING
          readOnly: true
        versionedComponentId:
          type: string
          description: The ID of the corresponding component that is under version control
    ParameterEntity:
      type: object
      description: The name of the Parameter
      properties:
        canWrite:
          type: boolean
          description: Indicates whether the user can write a given resource.
          readOnly: true
        parameter:
          $ref: '#/components/schemas/ParameterDTO'
      xml:
        name: parameterEntity
    ProcessGroupNameDTO:
      type: object
      description: The Process Group that the component belongs to
      properties:
        id:
          type: string
          description: The ID of the Process Group
        name:
          type: string
          description: The name of the Process Group, or the ID of the Process Group if the user does not have the READ policy for the Process Group
    RelationshipDTO:
      type: object
      description: The available relationships that the processor currently supports.
      properties:
        autoTerminate:
          type: boolean
          description: Whether or not FlowFiles sent to this relationship should auto terminate.
        description:
          type: string
          description: The relationship description.
        name:
          type: string
          description: The relationship name.
