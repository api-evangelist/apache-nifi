openapi: 3.2.0
info:
  contact:
    email: dev@nifi.apache.org
    url: https://nifi.apache.org
  description: REST API definition for Apache NiFi web services
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: Apache NiFi REST Controller Services API
  version: 2.12.0
security:
- HTTPBearerJWT: []
- CookieSecureAuthorizationBearer: []
tags:
- name: Controller Services
paths:
  /controller-services/{id}:
    delete:
      operationId: removeControllerService
      parameters:
      - description: The revision is used to verify the client is working with the latest version of the flow.
        in: query
        name: version
        schema:
          $ref: '#/components/schemas/LongParameter'
      - description: If the client id is not specified, new one will be generated. This value (whether specified or generated) is included in the response.
        in: query
        name: clientId
        schema:
          $ref: '#/components/schemas/ClientIdParameter'
      - description: Acknowledges that this node is disconnected to allow for mutable requests to proceed.
        in: query
        name: disconnectedNodeAcknowledged
        schema:
          type: boolean
          default: false
      - description: The controller service id.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerServiceEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /controller-services/{uuid}: []
      - Write - Parent Process Group if scoped by Process Group - /process-groups/{uuid}: []
      - Write - Controller if scoped by Controller - /controller: []
      - Read - any referenced Controller Services - /controller-services/{uuid}: []
      summary: Deletes a controller service
      tags:
      - Controller Services
    get:
      description: If the uiOnly query parameter is provided with a value of true, the returned entity may only contain fields that are necessary for rendering the NiFi User Interface. As such, the selected fields may change at any time, even during incremental releases, without warning. As a result, this parameter should not be provided by any client other than the UI.
      operationId: getControllerService
      parameters:
      - description: The controller service id.
        in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: uiOnly
        schema:
          type: boolean
          default: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerServiceEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /controller-services/{uuid}: []
      summary: Gets a controller service
      tags:
      - Controller Services
    put:
      operationId: updateControllerService
      parameters:
      - description: The controller service id.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControllerServiceEntity'
        description: The controller service configuration details.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerServiceEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /controller-services/{uuid}: []
      - Read - any referenced Controller Services if this request changes the reference - /controller-services/{uuid}: []
      summary: Updates a controller service
      tags:
      - Controller Services
  /controller-services/{id}/bulletins/clear-requests:
    post:
      operationId: clearBulletins
      parameters:
      - description: The controller service id.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClearBulletinsRequestEntity'
        description: The clear bulletin request specifying the timestamp from which to clear bulletins.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearBulletinsResultEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /controller-services/{uuid}: []
      summary: Clears bulletins for a controller service
      tags:
      - Controller Services
  /controller-services/{id}/config/analysis:
    post:
      operationId: analyzeConfiguration
      parameters:
      - description: The controller service id.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationAnalysisEntity'
        description: The configuration analysis request.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationAnalysisEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /controller-services/{uuid}: []
      summary: Performs analysis of the component's configuration, providing information about…
      tags:
      - Controller Services
  /controller-services/{id}/config/verification-requests:
    post:
      description: This will initiate the process of verifying a given Controller Service configuration. This may be a long-running task. As a result, this endpoint will immediately return a ControllerServiceConfigVerificationRequestEntity, and the process of performing the verification will occur asynchronously in the background. The client may then periodically poll the status of the request by issuing a GET request to /controller-services/{serviceId}/verification-requests/{requestId}. Once the request is completed, the client is expected to issue a DELETE request to /controller-services/{serviceId}/verification-requests/{requestId}.
      operationId: submitConfigVerificationRequest
      parameters:
      - description: The controller service id.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyConfigRequestEntity'
        description: The controller service configuration verification request.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyConfigRequestEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /controller-services/{uuid}: []
      - Read - any referenced Controller Services - /controller-services/{uuid}: []
      summary: Performs verification of the Controller Service's configuration
      tags:
      - Controller Services
  /controller-services/{id}/config/verification-requests/{requestId}:
    delete:
      description: Deletes the Verification Request with the given ID. After a request is created, it is expected that the client will properly clean up the request by DELETE'ing it, once the Verification process has completed. If the request is deleted before the request completes, then the Verification request will finish the step that it is currently performing and then will cancel any subsequent steps.
      operationId: deleteVerificationRequest
      parameters:
      - description: The ID of the Controller Service
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The ID of the Verification Request
        in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyConfigRequestEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Only the user that submitted the request can remove it: []
      summary: Deletes the Verification Request with the given ID
      tags:
      - Controller Services
    get:
      description: Returns the Verification Request with the given ID. Once an Verification Request has been created, that request can subsequently be retrieved via this endpoint, and the request that is fetched will contain the updated state, such as percent complete, the current state of the request, and any failures.
      operationId: getVerificationRequest
      parameters:
      - description: The ID of the Controller Service
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The ID of the Verification Request
        in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyConfigRequestEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Only the user that submitted the request can get it: []
      summary: Returns the Verification Request with the given ID
      tags:
      - Controller Services
  /controller-services/{id}/descriptors:
    get:
      operationId: getPropertyDescriptor_1
      parameters:
      - description: The controller service id.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The property name to return the descriptor for.
        in: query
        name: propertyName
        required: true
        schema:
          type: string
      - description: Property Descriptor requested sensitive status
        in: query
        name: sensitive
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDescriptorEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /controller-services/{uuid}: []
      summary: Gets a controller service property descriptor
      tags:
      - Controller Services
  /controller-services/{id}/references:
    get:
      operationId: getControllerServiceReferences
      parameters:
      - description: The controller service id.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerServiceReferencingComponentsEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /controller-services/{uuid}: []
      summary: Gets a controller service
      tags:
      - Controller Services
    put:
      operationId: updateControllerServiceReferences
      parameters:
      - description: The controller service id.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateControllerServiceReferenceRequestEntity'
        description: The controller service request update request.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerServiceReferencingComponentsEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /{component-type}/{uuid} or /operate/{component-type}/{uuid} - For each referencing component specified: []
      summary: Updates a controller services references
      tags:
      - Controller Services
  /controller-services/{id}/run-status:
    put:
      operationId: updateRunStatus_2
      parameters:
      - description: The controller service id.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControllerServiceRunStatusEntity'
        description: The controller service run status.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerServiceEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /controller-services/{uuid} or /operation/controller-services/{uuid}: []
      summary: Updates run status of a controller service
      tags:
      - Controller Services
  /controller-services/{id}/state:
    get:
      operationId: getState
      parameters:
      - description: The controller service id.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentStateEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /controller-services/{uuid}: []
      summary: Gets the state for a controller service
      tags:
      - Controller Services
  /controller-services/{id}/state/clear-requests:
    post:
      operationId: clearState_1
      parameters:
      - description: The controller service id.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/ComponentStateEntity'
          application/json:
            schema:
              $ref: '#/components/schemas/ComponentStateEntity'
        description: Optional component state to perform a selective key removal. If omitted, clears all state.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentStateEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /controller-services/{uuid}: []
      summary: Clears the state for a controller service
      tags:
      - Controller Services
components:
  schemas:
    PropertyDescriptorDTO:
      type: object
      description: The descriptors for the reporting tasks properties.
      properties:
        allowableValues:
          type: array
          description: Allowable values for the property. If empty then the allowed values are not constrained.
          items:
            $ref: '#/components/schemas/AllowableValueEntity'
        defaultValue:
          type: string
          description: The default value for the property.
        dependencies:
          type: array
          description: A list of dependencies that must be met in order for this Property to be relevant. If any of these dependencies is not met, the property described by this Property Descriptor is not relevant.
          items:
            $ref: '#/components/schemas/PropertyDependencyDTO'
        description:
          type: string
          description: The description for the property. Used to relay additional details to a user or provide a mechanism of documenting intent.
        displayName:
          type: string
          description: The human readable name for the property.
        dynamic:
          type: boolean
          description: Whether the property is dynamic (user-defined).
        expressionLanguageScope:
          type: string
          description: Scope of the Expression Language evaluation for the property.
        identifiesControllerService:
          type: string
          description: If the property identifies a controller service this returns the fully qualified type.
        identifiesControllerServiceBundle:
          $ref: '#/components/schemas/BundleDTO'
        name:
          type: string
          description: The name for the property.
        required:
          type: boolean
          description: Whether the property is required.
        sensitive:
          type: boolean
          description: Whether the property is sensitive and protected whenever stored or represented.
        supportsEl:
          type: boolean
          description: Whether the property supports expression language.
    StateMapDTO:
      type: object
      description: The local state for this component.
      properties:
        scope:
          type: string
          description: The scope of this StateMap.
        state:
          type: array
          description: The state.
          items:
            $ref: '#/components/schemas/StateEntryDTO'
        totalEntryCount:
          type: integer
          format: int32
          description: The total number of state entries. When the state map is lengthy, only of portion of the entries are returned.
    ConfigVerificationResultDTO:
      type: object
      description: The Results of the verification
      properties:
        explanation:
          type: string
          description: An explanation of why the step was or was not successful
        outcome:
          type: string
          description: The outcome of the verification
          enum:
          - SUCCESSFUL
          - FAILED
          - SKIPPED
        subject:
          type: string
          description: The subject of the verification step
        verificationStepName:
          type: string
          description: The name of the verification step
      readOnly: true
    ControllerServiceReferencingComponentEntity:
      type: object
      description: All components referencing this controller service.
      properties:
        bulletins:
          type: array
          description: The bulletins for this component.
          items:
            $ref: '#/components/schemas/BulletinEntity'
        component:
          $ref: '#/components/schemas/ControllerServiceReferencingComponentDTO'
        disconnectedNodeAcknowledged:
          type: boolean
          description: Acknowledges that this node is disconnected to allow for mutable requests to proceed.
        id:
          type: string
          description: The id of the component.
        operatePermissions:
          $ref: '#/components/schemas/PermissionsDTO'
        permissions:
          $ref: '#/components/schemas/PermissionsDTO'
        position:
          $ref: '#/components/schemas/PositionDTO'
        revision:
          $ref: '#/components/schemas/RevisionDTO'
        uri:
          type: string
          description: The URI for futures requests to the component.
      xml:
        name: controllerServiceReferencingComponentEntity
    ClearBulletinsRequestEntity:
      type: object
      properties:
        fromTimestamp:
          type: string
          description: The timestamp from which to clear bulletins (inclusive). This field is required.
      required:
      - fromTimestamp
      xml:
        name: clearBulletinsRequestEntity
    VerifyConfigRequestEntity:
      type: object
      properties:
        request:
          $ref: '#/components/schemas/VerifyConfigRequestDTO'
      xml:
        name: verifyConfigRequest
    ControllerServiceDTO:
      type: object
      description: The controller services in this flow snippet.
      properties:
        annotationData:
          type: string
          description: The annotation for the controller service. This is how the custom UI relays configuration to the controller service.
        bulletinLevel:
          type: string
          description: The level at which the controller service will report bulletins.
        bundle:
          $ref: '#/components/schemas/BundleDTO'
        comments:
          type: string
          description: The comments for the controller service.
        controllerServiceApis:
          type: array
          description: Lists the APIs this Controller Service implements.
          items:
            $ref: '#/components/schemas/ControllerServiceApiDTO'
        customUiUrl:
          type: string
          description: The URL for the controller services custom configuration UI if applicable.
        deprecated:
          type: boolean
          description: Whether the controller service has been deprecated.
        descriptors:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PropertyDescriptorDTO'
          description: The descriptors for the controller service properties.
        extensionMissing:
          type: boolean
          description: Whether the underlying extension is missing.
        id:
          type: string
          description: The id of the component.
        multipleVersionsAvailable:
          type: boolean
          description: Whether the controller service has multiple versions available.
        name:
          type: string
          description: The name of the controller service.
        parentGroupId:
          type: string
          description: The id of parent process group of this component if applicable.
        persistsState:
          type: boolean
          description: Whether the controller service persists state.
        position:
          $ref: '#/components/schemas/PositionDTO'
        properties:
          type: object
          additionalProperties:
            type: string
            description: The properties of the controller service.
          description: The properties of the controller service.
        referencingComponents:
          type: array
          description: All components referencing this controller service.
          items:
            $ref: '#/components/schemas/ControllerServiceReferencingComponentEntity'
          uniqueItems: true
        restricted:
          type: boolean
          description: Whether the controller service requires elevated privileges.
        sensitiveDynamicPropertyNames:
          type: array
          description: Set of sensitive dynamic property names
          items:
            type: string
            description: Set of sensitive dynamic property names
          uniqueItems: true
        state:
          type: string
          description: The state of the controller service.
          enum:
          - ENABLED
          - ENABLING
          - DISABLED
          - DISABLING
        supportsSensitiveDynamicProperties:
          type: boolean
          description: Whether the controller service supports sensitive dynamic properties.
        type:
          type: string
          description: The type of the controller service.
        validationErrors:
          type: array
          description: 'The validation errors from the controller service.

            These validation errors represent the problems with the controller service that must be resolved before it can be enabled.

            '
          items:
            type: string
            description: 'The validation errors from the controller service.

              These validation errors represent the problems with the controller service that must be resolved before it can be enabled.

              '
        validationStatus:
          type: string
          description: Indicates whether the ControllerService is valid, invalid, or still in the process of validating (i.e., it is unknown whether or not the ControllerService is valid)
          enum:
          - VALID
          - INVALID
          - VALIDATING
          readOnly: true
        versionedComponentId:
          type: string
          description: The ID of the corresponding component that is under version control
    ControllerServiceReferencingComponentDTO:
      type: object
      properties:
        activeThreadCount:
          type: integer
          format: int32
          description: The number of active threads for the referencing component.
        descriptors:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PropertyDescriptorDTO'
          description: The descriptors for the component properties.
        groupId:
          type: string
          description: The group id for the component referencing a controller service. If this component is another controller service or a reporting task, this field is blank.
        id:
          type: string
          description: The id of the component referencing a controller service.
        name:
          type: string
          description: The name of the component referencing a controller service.
        properties:
          type: object
          additionalProperties:
            type: string
            description: The properties for the component.
          description: The properties for the component.
        referenceCycle:
          type: boolean
          description: If the referencing component represents a controller service, this indicates whether it has already been represented in this hierarchy.
        referenceType:
          type: string
          description: The type of reference this is.
          enum:
          - Processor
          - ControllerService
          - ReportingTask
          - FlowRegistryClient
          - ParameterProvider
          - FlowAnalysisRule
        referencingComponents:
          type: array
          description: If the referencing component represents a controller service, these are the components that reference it.
          items:
            $ref: '#/components/schemas/ControllerServiceReferencingComponentEntity'
          uniqueItems: true
        state:
          type: string
          description: The scheduled state of a processor or reporting task referencing a controller service. If this component is another controller service, this field represents the controller service state.
        type:
          type: string
          description: The type of the component referencing a controller service in simple Java class name format without package name.
        validationErrors:
          type: array
          description: The validation errors for the component.
          items:
            type: string
            description: The validation errors for the component.
    AllowableValueDTO:
      type: object
      properties:
        description:
          type: string
          description: A description for this allowable value.
        displayName:
          type: string
          description: A human readable value that is allowed for the property descriptor.
        value:
