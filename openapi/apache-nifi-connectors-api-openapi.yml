        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /connectors/{uuid} or /operation/connectors/{uuid}: []
      summary: Transitions a Connector out of Troubleshooting mode
      tags:
      - Connectors
    post:
      description: Places the Connector into Troubleshooting mode so that its managed flow may be directly modified. Standard lifecycle operations are disabled while in Troubleshooting mode.
      operationId: enterTroubleshooting
      parameters:
      - description: The connector id.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorEntity'
        description: The connector entity with revision.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /connectors/{uuid} or /operation/connectors/{uuid}: []
      summary: Transitions a Connector into Troubleshooting mode
      tags:
      - Connectors
  /connectors/{id}/working-configuration:
    delete:
      description: This will discard any pending configuration changes for the connector and revert to the last applied configuration.
      operationId: discardConnectorUpdate
      parameters:
