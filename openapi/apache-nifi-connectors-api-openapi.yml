openapi: 3.2.0
info:
  contact:
    email: dev@nifi.apache.org
    url: https://nifi.apache.org
  description: REST API definition for Apache NiFi web services
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: Apache NiFi REST Connectors API
  version: 2.12.0
security:
- HTTPBearerJWT: []
- CookieSecureAuthorizationBearer: []
tags:
- name: Connectors
paths:
  /connectors:
    post:
      operationId: createConnector
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorEntity'
        description: The connector configuration details.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /connectors: []
      summary: Creates a new connector
      tags:
      - Connectors
  /connectors/{connectorId}/flow/process-groups/{processGroupId}:
    get:
      description: Returns the flow for the specified process group within the connector's hierarchy. The processGroupId can be obtained from the managedProcessGroupId field of the ConnectorDTO for the root process group, or from child process groups within the flow. If the uiOnly query parameter is provided with a value of true, the returned entity may only contain fields that are necessary for rendering the NiFi User Interface. As such, the selected fields may change at any time, even during incremental releases, without warning. As a result, this parameter should not be provided by any client other than the UI.
      operationId: getFlow
      parameters:
      - description: The connector id.
        in: path
        name: connectorId
        required: true
        schema:
          type: string
      - description: The process group id.
        in: path
        name: processGroupId
        required: true
        schema:
          type: string
      - description: Whether to return only UI-specific fields
        in: query
        name: uiOnly
        schema:
          type: boolean
          default: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessGroupFlowEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /connectors/{uuid}: []
      summary: Gets the flow for a process group within a connector
      tags:
      - Connectors
  /connectors/{connectorId}/flow/process-groups/{processGroupId}/controller-services:
    get:
      description: Returns the controller services for the specified process group within the connector's hierarchy. The processGroupId can be obtained from the managedProcessGroupId field of the ConnectorDTO for the root process group, or from child process groups within the flow.
      operationId: getControllerServicesFromConnectorProcessGroup
      parameters:
      - description: The connector id.
        in: path
        name: connectorId
        required: true
        schema:
          type: string
      - description: The process group id.
        in: path
        name: processGroupId
        required: true
        schema:
          type: string
      - description: Whether or not to include parent/ancestor process groups
        in: query
        name: includeAncestorGroups
        schema:
          type: boolean
          default: true
      - description: Whether or not to include descendant process groups
        in: query
        name: includeDescendantGroups
        schema:
          type: boolean
          default: false
      - description: Whether or not to include services' referencing components in the response
        in: query
        name: includeReferencingComponents
        schema:
          type: boolean
          default: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerServicesEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /connectors/{uuid}: []
      summary: Gets all controller services for a process group within a connector
      tags:
      - Connectors
  /connectors/{connectorId}/flow/process-groups/{processGroupId}/parameter-context:
    get:
      description: Returns the parameter context (with effective parameters, including those inherited from other contexts) bound to the specified process group within the connector's hierarchy. Sensitive parameter values are masked. Returns 204 No Content if the process group has no bound parameter context.
      operationId: getParameterContextForConnectorProcessGroup
      parameters:
      - description: The connector id.
        in: path
        name: connectorId
        required: true
        schema:
          type: string
      - description: The process group id.
        in: path
        name: processGroupId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterContextEntity'
        '204':
          description: The specified process group has no bound parameter context.
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /connectors/{uuid}: []
      summary: Gets the parameter context bound to a process group within a connector
      tags:
      - Connectors
  /connectors/{id}:
    delete:
      operationId: deleteConnector
      parameters:
      - description: The revision is used to verify the client is working with the latest version of the flow.
        in: query
        name: version
        schema:
          $ref: '#/components/schemas/LongParameter'
      - description: If the client id is not specified, new one will be generated. This value (whether specified or generated) is included in the response.
        in: query
        name: clientId
        schema:
          $ref: '#/components/schemas/ClientIdParameter'
      - description: Acknowledges that this node is disconnected to allow for mutable requests to proceed.
        in: query
        name: disconnectedNodeAcknowledged
        schema:
          type: boolean
          default: false
      - description: The connector id.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /connectors/{uuid}: []
      summary: Deletes a connector
      tags:
      - Connectors
    get:
      operationId: getConnector
      parameters:
      - description: The connector id.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /connectors/{uuid}: []
      summary: Gets a connector
      tags:
      - Connectors
    put:
      operationId: updateConnector
      parameters:
      - description: The connector id.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorEntity'
        description: The connector configuration details.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /connectors/{uuid}: []
      summary: Updates a connector
      tags:
      - Connectors
  /connectors/{id}/apply-update:
    post:
      description: This will apply any pending configuration changes to the connector. The client can poll the connector endpoint to check when the update is complete.
      operationId: applyConnectorUpdate
      parameters:
      - description: The connector id.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorEntity'
        description: The connector configuration with revision.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /connectors/{uuid}: []
      summary: Applies an update to a connector
      tags:
      - Connectors
  /connectors/{id}/assets:
    get:
      description: Lists the assets that belong to the Connector with the given ID.
      operationId: getAssets
      parameters:
      - description: The connector id.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetsEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /connectors/{uuid}: []
      summary: Lists the assets that belong to the Connector with the given ID
      tags:
      - Connectors
    post:
      description: This endpoint will create a new Asset in the Connector. The Asset will be created with the given name and the contents of the file that is uploaded.
      operationId: createAsset
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: Filename
        schema:
          type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: object
        description: The contents of the asset
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /connectors/{uuid}: []
      summary: Creates a new Asset in the given Connector
      tags:
      - Connectors
  /connectors/{id}/assets/{assetId}:
    get:
      operationId: getAssetContent
      parameters:
      - description: The connector id.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The asset id.
        in: path
        name: assetId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: byte
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /connectors/{uuid}: []
      summary: Retrieves the content of the asset with the given id for a connector
      tags:
      - Connectors
  /connectors/{id}/backlog-requests:
    post:
      description: This will initiate the process of determining the backlog for a Connector. This may be a long-running task. As a result, this endpoint will immediately return a BacklogRequestEntity, and the process of determining the backlog will occur asynchronously in the background. The client may then periodically poll the status of the request by issuing a GET request to /connectors/{id}/backlog-requests/{requestId}. Once the request is completed, the client is expected to issue a DELETE request to /connectors/{id}/backlog-requests/{requestId}.
      operationId: submitConnectorBacklogRequest
      parameters:
      - description: The connector id.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacklogRequestEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /connectors/{uuid}: []
      summary: Initiates a request to determine the current backlog for a Connector
      tags:
      - Connectors
  /connectors/{id}/backlog-requests/{requestId}:
    delete:
      description: Deletes the Backlog Request with the given ID. After a request is created, it is expected that the client will properly clean up the request by DELETE'ing it once the backlog determination has completed. If the request is deleted before it completes, the background determination is cancelled.
      operationId: deleteConnectorBacklogRequest
      parameters:
      - description: The connector id.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The ID of the Backlog Request
        in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacklogRequestEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Only the user that submitted the request can remove it: []
      summary: Deletes the Backlog Request with the given ID
      tags:
      - Connectors
    get:
      description: Returns the Backlog Request with the given ID. Once a Backlog Request has been created by performing a POST to /connectors/{id}/backlog-requests, that request can subsequently be retrieved via this endpoint, and the request that is fetched will contain the updated state, such as percent complete, the current state of the request, and the backlog once the request is complete.
      operationId: getConnectorBacklogRequest
      parameters:
      - description: The connector id.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The ID of the Backlog Request
        in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacklogRequestEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Only the user that submitted the request can get it: []
      summary: Returns the Backlog Request with the given ID
      tags:
      - Connectors
  /connectors/{id}/configuration-steps:
    get:
      operationId: getConnectorConfigurationSteps
      parameters:
      - description: The connector id.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationStepNamesEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /connectors/{uuid}: []
      summary: Gets all configuration step names for a connector
      tags:
      - Connectors
  /connectors/{id}/configuration-steps/{configurationStepName}:
    get:
      operationId: getConnectorConfigurationStep
      parameters:
      - description: The connector id.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The configuration step name.
        in: path
        name: configurationStepName
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationStepEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /connectors/{uuid}: []
      summary: Gets a specific configuration step by name for a connector
      tags:
      - Connectors
    put:
      operationId: updateConnectorConfigurationStep
      parameters:
      - description: The connector id.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The configuration step name.
        in: path
        name: configurationStepName
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationStepEntity'
        description: The configuration step configuration.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationStepEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /connectors/{uuid}: []
      - Read - any referenced Parameter Providers - /parameter-providers/{uuid}: []
      - Read - /connectors/{uuid} when referencing Assets owned by the connector: []
      summary: Updates a specific configuration step by name for a connector
      tags:
      - Connectors
  ? /connectors/{id}/configuration-steps/{configurationStepName}/property-groups/{propertyGroupName}/properties/{propertyName}/allowable-values
  : get:
      description: Gets the allowable values for a specific property that supports dynamic fetching of allowable values. The filter parameter can be used to narrow down the results based on the property's filtering logic.
      operationId: getConnectorPropertyAllowableValues
      parameters:
      - description: The connector id.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The configuration step name.
        in: path
        name: configurationStepName
        required: true
        schema:
          type: string
      - description: The property group name.
        in: path
        name: propertyGroupName
        required: true
        schema:
          type: string
      - description: The property name.
        in: path
        name: propertyName
        required: true
        schema:
          type: string
      - description: Optional filter to narrow down the allowable values.
        in: query
        name: filter
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorPropertyAllowableValuesEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /connectors/{uuid}: []
      summary: Gets the allowable values for a specific property in a connector's…
      tags:
      - Connectors
  /connectors/{id}/configuration-steps/{configurationStepName}/verify-config:
    post:
      description: This will initiate the process of verifying a given Connector Configuration Step. This may be a long-running task. As a result, this endpoint will immediately return a VerifyConnectorConfigStepRequestEntity, and the process of performing the verification will occur asynchronously in the background. The client may then periodically poll the status of the request by issuing a GET request to /connectors/{connectorId}/configuration-steps/{stepName}/verify-config/{requestId}. Once the request is completed, the client is expected to issue a DELETE request to /connectors/{connectorId}/configuration-steps/{stepName}/verify-config/{requestId}.
      operationId: submitConfigurationStepVerificationRequest
      parameters:
      - description: The connector id.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The configuration step name.
        in: path
        name: configurationStepName
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyConnectorConfigStepRequestEntity'
        description: The verify config request entity containing the configuration step to verify.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyConnectorConfigStepRequestEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /connectors/{uuid}: []
      - Read - any referenced Parameter Providers - /parameter-providers/{uuid}: []
      - Read - /connectors/{uuid} when referencing Assets owned by the connector: []
      summary: Performs verification of a configuration step for a connector
      tags:
      - Connectors
  /connectors/{id}/configuration-steps/{configurationStepName}/verify-config/{requestId}:
    delete:
      description: Deletes the Verification Request with the given ID. After a request is created, it is expected that the client will properly clean up the request by DELETE'ing it, once the Verification process has completed. If the request is deleted before the request completes, then the Verification request will finish the step that it is currently performing and then will cancel any subsequent steps.
      operationId: deleteConfigurationStepVerificationRequest
      parameters:
      - description: The connector id.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The configuration step name.
        in: path
        name: configurationStepName
        required: true
        schema:
          type: string
      - description: The ID of the Verification Request
        in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyConnectorConfigStepRequestEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Only the user that submitted the request can remove it: []
      summary: Deletes the Verification Request with the given ID
      tags:
      - Connectors
    get:
      description: Returns the Verification Request with the given ID. Once a Verification Request has been created, that request can subsequently be retrieved via this endpoint, and the request that is fetched will contain the updated state, such as percent complete, the current state of the request, and any failures.
      operationId: getConfigurationStepVerificationRequest
      parameters:
      - description: The connector id.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The configuration step name.
