      operationId: createBulletin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulletinEntity'
        description: The reporting task configuration details.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
