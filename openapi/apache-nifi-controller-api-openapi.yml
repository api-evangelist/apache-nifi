          type: string
          description: The name of the Process Group, or the ID of the Process Group if the user does not have the READ policy for the Process Group
    ComponentDetailsDTO:
      type: object
      description: The details of the source component.
    VersionedComponentState:
      type: object
      description: The state of the component, if exported with state
      properties:
        clusterState:
          type: object
          additionalProperties:
            type: string
            description: The cluster-scoped state of the component, or null if not exported
