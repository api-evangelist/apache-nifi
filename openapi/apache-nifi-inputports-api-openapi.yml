openapi: 3.2.0
info:
  contact:
    email: dev@nifi.apache.org
    url: https://nifi.apache.org
  description: REST API definition for Apache NiFi web services
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: Apache NiFi REST Input Ports API
  version: 2.12.0
security:
- HTTPBearerJWT: []
- CookieSecureAuthorizationBearer: []
tags:
- name: InputPorts
paths:
  /input-ports/{id}:
    delete:
      operationId: removeInputPort
      parameters:
      - description: The revision is used to verify the client is working with the latest version of the flow.
        in: query
        name: version
        schema:
          $ref: '#/components/schemas/LongParameter'
      - description: If the client id is not specified, new one will be generated. This value (whether specified or generated) is included in the response.
        in: query
        name: clientId
        schema:
          $ref: '#/components/schemas/ClientIdParameter'
      - description: Acknowledges that this node is disconnected to allow for mutable requests to proceed.
        in: query
        name: disconnectedNodeAcknowledged
        schema:
          type: boolean
          default: false
      - description: The input port id.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /input-ports/{uuid}: []
      - Write - Parent Process Group - /process-groups/{uuid}: []
      summary: Deletes an input port
      tags:
      - InputPorts
    get:
      operationId: getInputPort
      parameters:
      - description: The input port id.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Read - /input-ports/{uuid}: []
      summary: Gets an input port
      tags:
      - InputPorts
    put:
      operationId: updateInputPort
      parameters:
      - description: The input port id.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortEntity'
        description: The input port configuration details.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /input-ports/{uuid}: []
      summary: Updates an input port
      tags:
      - InputPorts
  /input-ports/{id}/bulletins/clear-requests:
    post:
      operationId: clearBulletins_2
      parameters:
      - description: The input port id.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClearBulletinsRequestEntity'
        description: The request to clear bulletins.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearBulletinsResultEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /input-ports/{uuid}: []
      summary: Clears bulletins for an input port
      tags:
      - InputPorts
  /input-ports/{id}/run-status:
    put:
      operationId: updateRunStatus_3
      parameters:
      - description: The port id.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortRunStatusEntity'
        description: The port run status.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessorEntity'
        '400':
          description: NiFi was unable to complete the request because it was invalid. The request should not be retried without modification.
        '401':
          description: Client could not be authenticated.
        '403':
          description: Client is not authorized to make this request.
        '404':
          description: The specified resource could not be found.
        '409':
          description: The request was valid but NiFi was not in the appropriate state to process it.
      security:
      - Write - /input-ports/{uuid} or /operation/input-ports/{uuid}: []
      summary: Updates run status of an input-port
      tags:
      - InputPorts
components:
  schemas:
    PropertyDescriptorDTO:
      type: object
      description: The descriptors for the reporting tasks properties.
      properties:
        allowableValues:
          type: array
          description: Allowable values for the property. If empty then the allowed values are not constrained.
          items:
            $ref: '#/components/schemas/AllowableValueEntity'
        defaultValue:
          type: string
          description: The default value for the property.
        dependencies:
          type: array
          description: A list of dependencies that must be met in order for this Property to be relevant. If any of these dependencies is not met, the property described by this Property Descriptor is not relevant.
          items:
            $ref: '#/components/schemas/PropertyDependencyDTO'
        description:
          type: string
          description: The description for the property. Used to relay additional details to a user or provide a mechanism of documenting intent.
        displayName:
          type: string
          description: The human readable name for the property.
        dynamic:
          type: boolean
          description: Whether the property is dynamic (user-defined).
        expressionLanguageScope:
          type: string
          description: Scope of the Expression Language evaluation for the property.
        identifiesControllerService:
          type: string
          description: If the property identifies a controller service this returns the fully qualified type.
        identifiesControllerServiceBundle:
          $ref: '#/components/schemas/BundleDTO'
        name:
          type: string
          description: The name for the property.
        required:
          type: boolean
          description: Whether the property is required.
        sensitive:
          type: boolean
          description: Whether the property is sensitive and protected whenever stored or represented.
        supportsEl:
          type: boolean
          description: Whether the property supports expression language.
    ProcessingPerformanceStatusDTO:
      type: object
      description: Represents the processor's processing performance.
      properties:
        contentReadDuration:
          type: integer
          format: int64
          description: The number of nanoseconds has spent to read content in the last 5 minutes.
        contentWriteDuration:
          type: integer
          format: int64
          description: The number of nanoseconds has spent to write content in the last 5 minutes.
        cpuDuration:
          type: integer
          format: int64
          description: The number of nanoseconds has spent on CPU usage in the last 5 minutes.
        garbageCollectionDuration:
          type: integer
          format: int64
          description: The number of nanoseconds has spent running garbage collection in the last 5 minutes.
        identifier:
          type: string
          description: The unique ID of the process group that the Processor belongs to
        sessionCommitDuration:
          type: integer
          format: int64
          description: The number of nanoseconds has spent running to commit sessions the last 5 minutes.
    ProcessorDTO:
      type: object
      properties:
        bundle:
          $ref: '#/components/schemas/BundleDTO'
        config:
          $ref: '#/components/schemas/ProcessorConfigDTO'
        deprecated:
          type: boolean
          description: Whether the processor has been deprecated.
        description:
          type: string
          description: The description of the processor.
        executionNodeRestricted:
          type: boolean
          description: Indicates if the execution node of a processor is restricted to run only on the primary node
        extensionMissing:
          type: boolean
          description: Whether the underlying extension is missing.
        id:
          type: string
          description: The id of the component.
        inputRequirement:
          type: string
          description: The input requirement for this processor.
        multipleVersionsAvailable:
          type: boolean
          description: Whether the processor has multiple versions available.
        name:
          type: string
          description: The name of the processor.
        parentGroupId:
          type: string
          description: The id of parent process group of this component if applicable.
        persistsState:
          type: boolean
          description: Whether the processor persists state.
        physicalState:
          type: string
          description: The physical state of the processor, including transition states
          enum:
          - RUNNING
          - STOPPED
          - DISABLED
          - STARTING
          - STOPPING
          - RUN_ONCE
        position:
          $ref: '#/components/schemas/PositionDTO'
        relationships:
          type: array
          description: The available relationships that the processor currently supports.
          items:
            $ref: '#/components/schemas/RelationshipDTO'
          readOnly: true
        restricted:
          type: boolean
          description: Whether the processor requires elevated privileges.
        state:
          type: string
          description: The state of the processor
          enum:
          - RUNNING
          - STOPPED
          - DISABLED
          - RUN_ONCE
        style:
          type: object
          additionalProperties:
            type: string
            description: 'Styles for the processor (background-color : #eee).'
          description: 'Styles for the processor (background-color : #eee).'
        supportsBacklogReporting:
          type: boolean
          description: Whether the processor implements BacklogReportingProcessor and can report a backlog.
        supportsBatching:
          type: boolean
          description: Whether the processor supports batching. This makes the run duration settings available.
        supportsParallelProcessing:
          type: boolean
          description: Whether the processor supports parallel processing.
        supportsSensitiveDynamicProperties:
          type: boolean
          description: Whether the processor supports sensitive dynamic properties.
        type:
          type: string
          description: The type of the processor.
        validationErrors:
          type: array
          description: The validation errors for the processor. These validation errors represent the problems with the processor that must be resolved before it can be started.
          items:
            type: string
            description: The validation errors for the processor. These validation errors represent the problems with the processor that must be resolved before it can be started.
        validationStatus:
          type: string
          description: Indicates whether the Processor is valid, invalid, or still in the process of validating (i.e., it is unknown whether or not the Processor is valid)
          enum:
          - VALID
          - INVALID
          - VALIDATING
          readOnly: true
        versionedComponentId:
          type: string
          description: The ID of the corresponding component that is under version control
    ClearBulletinsRequestEntity:
      type: object
      properties:
        fromTimestamp:
          type: string
          description: The timestamp from which to clear bulletins (inclusive). This field is required.
      required:
      - fromTimestamp
      xml:
        name: clearBulletinsRequestEntity
    PortDTO:
      type: object
      description: The output ports available to received data from the NiFi.
      properties:
        allowRemoteAccess:
          type: boolean
          description: Whether this port can be accessed remotely via Site-to-Site protocol.
        comments:
          type: string
          description: The comments for the port.
        concurrentlySchedulableTaskCount:
          type: integer
          format: int32
          description: The number of tasks that should be concurrently scheduled for the port.
        id:
          type: string
          description: The id of the component.
        name:
          type: string
          description: The name of the port.
        parentGroupId:
          type: string
          description: The id of parent process group of this component if applicable.
        portFunction:
          type: string
          description: Specifies how the Port functions
          enum:
          - STANDARD
          - FAILURE
        position:
          $ref: '#/components/schemas/PositionDTO'
        state:
          type: string
          description: The state of the port.
          enum:
          - RUNNING
          - STOPPED
          - DISABLED
        transmitting:
          type: boolean
          description: Whether the port has incoming or output connections to a remote NiFi. This is only applicable when the port is allowed to be accessed remotely.
        type:
          type: string
          description: The type of port.
          enum:
          - INPUT_PORT
          - OUTPUT_PORT
        validationErrors:
          type: array
          description: Gets the validation errors from this port. These validation errors represent the problems with the port that must be resolved before it can be started.
          items:
            type: string
            description: Gets the validation errors from this port. These validation errors represent the problems with the port that must be resolved before it can be started.
        versionedComponentId:
          type: string
          description: The ID of the corresponding component that is under version control
    RelationshipDTO:
      type: object
      description: The available relationships that the processor currently supports.
      properties:
        autoTerminate:
          type: boolean
          description: Whether or not FlowFiles sent to this relationship should auto terminate.
        description:
          type: string
          description: The relationship description.
        name:
          type: string
          description: The relationship name.
        retry:
          type: boolean
          description: Whether or not FlowFiles sent to this relationship should retry.
      readOnly: true
    NodeProcessorStatusSnapshotDTO:
      type: object
      description: A status snapshot for each node in the cluster. If the NiFi instance is a standalone instance, rather than a cluster, this may be null.
      properties:
        address:
          type: string
          description: The API address of the node
        apiPort:
          type: integer
          format: int32
          description: The API port used to communicate with the node
        nodeId:
          type: string
          description: The unique ID that identifies the node
        statusSnapshot:
          $ref: '#/components/schemas/ProcessorStatusSnapshotDTO'
    ProcessorConfigDTO:
      type: object
      description: The configuration details for the processor. These details will be included in a response if the verbose flag is included in a request.
      properties:
        annotationData:
          type: string
          description: The annotation data for the processor used to relay configuration between a custom UI and the processor.
        autoTerminatedRelationships:
          type: array
          description: The names of all relationships that cause a flow file to be terminated if the relationship is not connected elsewhere. This property differs from the 'isAutoTerminate' property of the RelationshipDTO in that the RelationshipDTO is meant to depict the current configuration, whereas this property can be set in a DTO when updating a Processor in order to change which Relationships should be auto-terminated.
          items:
            type: string
            description: The names of all relationships that cause a flow file to be terminated if the relationship is not connected elsewhere. This property differs from the 'isAutoTerminate' property of the RelationshipDTO in that the RelationshipDTO is meant to depict the current configuration, whereas this property can be set in a DTO when updating a Processor in order to change which Relationships should be auto-terminated.
          uniqueItems: true
        backoffMechanism:
          type: string
          description: 'Determines whether the FlowFile should be penalized or the processor should be yielded between retries. Possible returned values: PENALIZE_FLOWFILE, YIELD_PROCESSOR. See BackoffMechanism.class for more details.'
        bulletinLevel:
          type: string
          description: The level at which the processor will report bulletins.
        comments:
          type: string
          description: The comments for the processor.
        concurrentlySchedulableTaskCount:
          type: integer
          format: int32
          description: The number of tasks that should be concurrently schedule for the processor. If the processor doesn't allow parallel processing then any positive input will be ignored.
        customUiUrl:
          type: string
          description: The URL for the processor's custom configuration UI if applicable.
        defaultConcurrentTasks:
          type: object
          additionalProperties:
            type: string
            description: Maps default values for concurrent tasks for each applicable scheduling strategy.
          description: Maps default values for concurrent tasks for each applicable scheduling strategy.
        defaultSchedulingPeriod:
          type: object
          additionalProperties:
            type: string
            description: Maps default values for scheduling period for each applicable scheduling strategy.
          description: Maps default values for scheduling period for each applicable scheduling strategy.
        descriptors:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PropertyDescriptorDTO'
          description: Descriptors for the processor's properties.
        executionNode:
          type: string
          description: Indicates the node where the process will execute.
        lossTolerant:
          type: boolean
          description: Whether the processor is loss tolerant.
        maxBackoffPeriod:
          type: string
          description: Maximum amount of time to be waited during a retry period.
        penaltyDuration:
          type: string
          description: The amount of time that is used when the process penalizes a flowfile.
        properties:
          type: object
          additionalProperties:
            type: string
            description: The properties for the processor. Properties whose value is not set will only contain the property name.
          description: The properties for the processor. Properties whose value is not set will only contain the property name.
        retriedRelationships:
          type: array
          description: All the relationships should be retried.
          items:
            type: string
            description: All the relationships should be retried.
          uniqueItems: true
        retryCount:
          type: integer
          format: int32
          description: Overall number of retries.
        runDurationMillis:
          type: integer
          format: int64
          description: The run duration for the processor in milliseconds.
        schedulingPeriod:
          type: string
          description: The frequency with which to schedule the processor. The format of the value will depend on th value of schedulingStrategy.
        schedulingStrategy:
          type: string
          description: Indicates how the processor should be scheduled to run.
        sensitiveDynamicPropertyNames:
          type: array
          description: Set of sensitive dynamic property names
          items:
            type: string
            description: Set of sensitive dynamic property names
          uniqueItems: true
        yieldDuration:
          type: string
          description: The amount of time that must elapse before this processor is scheduled again after yielding.
    AllowableValueDTO:
      type: object
      properties:
        description:
          type: string
          description: A description for this allowable value.
        displayName:
          type: string
          description: A human readable value that is allowed for the property descriptor.
        value:
          type: string
          description: A value that is allowed for the property descriptor.
    PortStatusSnapshotDTO:
      type: object
      properties:
        activeThreadCount:
          type: integer
          format: int32
          description: The active thread count for the port.
        bytesIn:
          type: integer
          format: int64
          description: The size of hte FlowFiles that have been accepted in the last 5 minutes.
        bytesOut:
          type: integer
          format: int64
          description: The number of bytes that have been processed in the last 5 minutes.
        flowFilesIn:
          type: integer
          format: int32
          description: The number of FlowFiles that have been accepted in the last 5 minutes.
        flowFilesOut:
          type: integer
          format: int32
          description: The number of FlowFiles that have been processed in the last 5 minutes.
        groupId:
          type: string
          description: The id of the parent process group of the port.
        id:
          type: string
          description: The id of the port.
        input:
          type: string
          description: The count/size of FlowFiles that have been accepted in the last 5 minutes.
        name:
          type: string
          description: The name of the port.
        output:
          type: string
          description: The count/size of FlowFiles that have been processed in the last 5 minutes.
        runStatus:
          type: string
          description: The run status of the port.
          enum:
          - Running
          - Stopped
          - Validating
          - Disabled
          - Invalid
        transmitting:
          type: boolean
          description: Whether the port has incoming or outgoing connections to a remote NiFi.
    ClearBulletinsResultEntity:
      type: object
      properties:
        bulletins:
          type: array
          description: The current bulletins for the component after clearing.
          items:
            $ref: '#/components/schemas/BulletinEntity'
        bulletinsCleared:
          type: integer
          format: int32
          description: The number of bulletins that were cleared.
        componentId:
          type: string
          description: The id of the component for which bulletins were cleared.
      xml:
        name: clearBulletinsResultEntity
    PropertyDependencyDTO:
      type: object
      description: A list of dependencies that must be met in order for this Property to be relevant. If any of these dependencies is not met, the property described by this Property Descriptor is not relevant.
      properties:
        dependentValues:
          type: array
          description: The values for the property that satisfies the dependency, or null if the dependency is satisfied by the presence of any value for the associated property name
          items:
            type: string
            description: The values for the property that satisfies the dependency, or null if the dependency is satisfied by the presence of any value for the associated property name
          uniqueItems: true
        propertyName:
          type: string
          description: The name of the property that is being depended upon
    BulletinEntity:
      type: object
      description: The bulletins for this component.
      properties:
        bulletin:
          $ref: '#/components/schemas/BulletinDTO'
        canRead:
          type: boolean
          description: Indicates whether the user can read a given resource.
          readOnly: true
        groupId:
          type: string
        id:
          type: integer
          format: int64
        nodeAddress:
          type: string
        sourceId:
          type: string
        timestamp:
          type: string
          description: When this bulletin was generated.
        timestampIso:
          type: string
          description: When this bulletin was generated in ISO format with full date and milliseconds.
      xml:
        name: bulletinEntity
    NodePortStatusSnapshotDTO:
      type: object
      description: A status snapshot for each node in the cluster. If the NiFi instance is a standalone instance, rather than a cluster, this may be null.
      properties:
        address:
          type: string
          description: The API address of the node
        apiPort:
          type: integer
          format: int32
          description: The API port used to communicate with the node
        nodeId:
          type: string
          description: The unique ID that identifies the node
        statusSnapshot:
          $ref: '#/components/schemas/PortStatusSnapshotDTO'
    RevisionDTO:
      type: object
      description: The revision of the Process Group
      properties:
        clientId:
          type: string
          description: 'A client identifier used to make a request.

            By including a client identifier, the API can allow multiple requests without needing the current revision.

            Due to the asynchronous nature of requests/responses this was implemented to allow the client to make numerous requests without having to wait for the previous response to come back

            '
        lastModifier:
          type: string
          description: The user that last modified the flow.
          readOnly: true
        version:
          type: integer
          format: int64
          description: 'NiFi employs an optimistic locking strategy where the client must include a revision in their request when performing an update.

            In a response to a mutable flow request, this field represents the updated base version.

            '
    PortEntity:
      type: object
      description: The output ports in this flow.
      properties:
        allowRemoteAccess:
          type: boolean
          description: Whether this port can be accessed remotely via Site-to-Site protocol.
        bulletins:
          type: array
          description: The bulletins for this component.
          items:
            $ref: '#/components/schemas/BulletinEntity'
        component:
          $ref: '#/components/schemas/PortDTO'
        disconnectedNodeAcknowledged:
          type: boolean
          description: Acknowledges that this node is disconnected to allow for mutable requests to proceed.
        id:
          type: string
          description: The id of the component.
        operatePermissions:
          $ref: '#/components/schemas/PermissionsDTO'
        permissions:
          $ref: '#/components/schemas/PermissionsDTO'
        portType:
          type: string
        position:
          $ref: '#/components/schemas/PositionDTO'
        revision:
          $ref: '#/components/schemas/RevisionDTO'
        status:
          $ref: '#/components/schemas/PortStatusDTO'
        uri:
          type: string
          description: The URI for futures requests to the component.
      xml:
        name: portEntity
    BundleDTO:
      type: object
      description: If the property identifies a controller service this returns the bundle of the type, null otherwise.
      properties:
        artifact:
          type: string
          description: The artifact of the bundle.
        group:
          type: string
          description: The group of the bundle.
        version:
          type: string
          description: The version of the bundle.
    PermissionsDTO:
      type: object
      description: The permissions for this component.
      properties:
        canRead:
          type: boolean
          description: Indicates whether the user can read a given resource.
          readOnly: true
        canWrite:
          type: boolean
          description: Indicates whether the user can write a given resource.
          readOnly: true
    PortRunStatusEntity:
      type: object
      properties:
        disconnectedNodeAcknowledged:
          type: boolean
          description: Acknowledges that this node is disconnected to allow for mutable requests to proceed.
        revision:
          $ref: '#/components/schemas/RevisionDTO'
        state:
          type: string
          description: The run status of the Port.
          enum:
          - RUNNING
          - STOPPED
          - DISABLED
      xml:
        name: entity
    LongParameter:
      type: object
      properties:
        long:
          type: integer
          format: int64
    BulletinDTO:
      type: object
      properties:
        category:
          type: string
          description: The category of this bulletin.
        groupId:
          type: string
          description: The group id of the source component.
        id:
          type: integer
          format: int64
          description: The id of the bulletin.
        level:
          type: string
          description: The level of the bulletin.
        message:
          type: string
          description: The bulletin message.
        nodeAddress:
          type: string
          description: If clustered, the address of the node from which the bulletin originated.
        sourceId:
          type: string
          description: The id of the source component.
        sourceName:
          type: string
          description: The name of the source component.
        sourceType:
          type: string
          description: The type of the source component
        stackTrace:
          type: string
          description: The stack trace associated with the bulletin, if any.
        timestamp:
          type: string
          description: When this bulletin was generated.
        timestampIso:
          type: string
          description: When this bulletin was generated in ISO format with full date and milliseconds.
    AllowableValueEntity:
      type: object
